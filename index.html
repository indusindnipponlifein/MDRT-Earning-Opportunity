<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1b2d">
<title>Thailand Training Convention</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#7a1b2d;
  --maroon-dark:#5a1220;
  --red:#d71f3b;
  --grey:#6b7280;
  --ink:#2b2b30;
  --soft:#767a82;
  --line:#e4e4e7;
  --white:#FFFFFF;
  --success:#2A9D6F;
  --font-display:'Playfair Display', Georgia, serif;
  --font-script:'Caveat', cursive;
  --font-body:'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  position:relative;
  min-height:100dvh;
  overflow-x:hidden;
  font-family:var(--font-body);
  color:var(--ink);
  background:radial-gradient(120% 60% at 50% 0%, #ffffff 0%, #f6f6f7 55%, #e6e6e9 100%);
  background-attachment:fixed;
}

/* background image: unchanged, now fades into the light page */
.bg-photo{position:fixed;inset:0;z-index:0;overflow:hidden;background:#f6f6f7;}
.bg-photo img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;}
.bg-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0) 30%, rgba(246,246,247,.92) 50%, #ececee 100%);
}
.bg-photo::after{ /* soft red glow */
  content:"";position:absolute;right:-90px;bottom:80px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle, rgba(215,31,59,.14), rgba(215,31,59,0) 70%);
}

/* confetti, one burst on load */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
.confetti span{position:absolute;top:-8%;width:7px;height:13px;opacity:0;border-radius:1px;animation:confettiFall 3.4s ease-in forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}85%{opacity:1;}100%{transform:translateY(72vh) rotate(340deg);opacity:0;}}
.confetti span:nth-child(odd){background:var(--red);}
.confetti span:nth-child(3n){background:var(--maroon);}
.confetti span:nth-child(4n){background:var(--grey);}
.confetti span:nth-child(1){left:6%;animation-delay:.10s;}
.confetti span:nth-child(2){left:14%;animation-delay:.50s;}
.confetti span:nth-child(3){left:22%;animation-delay:.15s;}
.confetti span:nth-child(4){left:30%;animation-delay:.65s;}
.confetti span:nth-child(5){left:38%;animation-delay:.30s;}
.confetti span:nth-child(6){left:46%;animation-delay:.05s;}
.confetti span:nth-child(7){left:54%;animation-delay:.45s;}
.confetti span:nth-child(8){left:62%;animation-delay:.20s;}
.confetti span:nth-child(9){left:70%;animation-delay:.55s;}
.confetti span:nth-child(10){left:78%;animation-delay:.35s;}
.confetti span:nth-child(11){left:86%;animation-delay:.10s;}
.confetti span:nth-child(12){left:94%;animation-delay:.50s;}
.confetti span:nth-child(13){left:50%;animation-delay:.60s;}
.confetti span:nth-child(14){left:18%;animation-delay:.40s;}

/* layout */
.stage{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:43dvh 22px calc(env(safe-area-inset-bottom,0px) + 40px);text-align:center;}

.subcopy{
  font-family:var(--font-body);font-size:1rem;font-weight:600;line-height:1.6;color:var(--maroon);
  max-width:420px;margin:0 auto;animation:rise .8s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

/* card */
.card{
  position:relative;z-index:1;background:var(--white);border-radius:28px;
  padding:36px 24px 28px;margin:26px auto 0;max-width:400px;text-align:center;
  border:1px solid var(--line);
  box-shadow:0 18px 40px rgba(122,27,45,.16);
  animation:rise .9s .3s ease both;
}
.card::before{ /* maroon to red strip across the top */
  content:"";position:absolute;left:0;right:0;top:0;height:6px;border-radius:28px 28px 0 0;
  background:linear-gradient(90deg, var(--maroon), var(--red));
}
.badge{
  position:absolute;top:-20px;right:-8px;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg, var(--maroon), var(--red));border:3px solid #fff;display:flex;align-items:center;justify-content:center;
  font-size:24px;box-shadow:0 8px 18px rgba(122,27,45,.35);
  animation:badgeIn .5s .8s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes badgeIn{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:1;}}

.input-wrap{
  padding:2px;border-radius:999px;margin-bottom:16px;
  background:linear-gradient(90deg, var(--maroon), var(--red));
}
input{
  display:block;width:100%;padding:15px 18px;font-size:16px;font-family:var(--font-body);font-weight:500;color:var(--ink);
  border-radius:999px;border:none;outline:none;text-align:center;
  background:#fff;
  transition:box-shadow .2s ease;
}
input:focus{box-shadow:0 0 0 4px rgba(215,31,59,.18);}
input::placeholder{color:#9a9ea6;}

button{
  width:100%;padding:17px;border:none;border-radius:999px;cursor:pointer;
  background:linear-gradient(90deg, var(--maroon), var(--red));color:#fff;
  font-family:var(--font-body);font-weight:700;font-size:1.02rem;
  box-shadow:0 14px 26px rgba(122,27,45,.32);
  transition:transform .15s ease, box-shadow .2s ease;
}
button:active{transform:scale(.97);}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none;}
button:focus-visible, input:focus-visible{outline:2px solid var(--red);outline-offset:3px;}

.loader{
  display:none;margin-top:16px;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--soft);
}
.loader.show{display:flex;}
.spinner{
  width:14px;height:14px;border:2px solid rgba(122,27,45,.18);border-top-color:var(--maroon);
  border-radius:50%;display:inline-block;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

#msg{margin-top:14px;text-align:center;font-weight:700;font-family:var(--font-body);font-size:15px;}
.success{color:var(--success);}
.error{color:var(--red);}

.footer-note{margin-top:22px;font-family:var(--font-script);font-size:1.6rem;font-weight:600;color:var(--maroon);animation:rise .9s .45s ease both;}

@media (max-width:480px){
  .stage{padding-left:18px;padding-right:18px;}
  .card{padding:34px 20px 26px;}
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>

<div class="bg-photo" aria-hidden="true">
  <img src="https://i.ibb.co/0ptbsV67/1792142228978.png" alt="">
  <div class="bg-overlay"></div>
</div>

<div class="confetti" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<main class="stage">
  <p class="subcopy">Enter your details below to view your personalised experience</p>

  <section class="card">
    <span class="badge" aria-hidden="true">🎉</span>

    <div class="input-wrap">
      <input
        id="input"
        placeholder="Advisor code / SAP ID / Mobile No."
        autocomplete="off"
      >
    </div>
    <button onclick="searchDoc()" id="btn">Click to view & download!</button>

    <div class="loader" id="loader"><span class="spinner"></span><span>Searching...</span></div>
    <div id="msg"></div>
  </section>

  <p class="footer-note">Make The Most Of It 📈</p>
</main>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbza_Nd0aJAwIrG2Ebrw-ziqch5LdaQDhU4hC7WwbzncsrjLT15dSelZAxDKfbbQadAq/exec";

async function searchDoc(){
  const value=document.getElementById("input").value.trim();
  const msg=document.getElementById("msg");
  const loader=document.getElementById("loader");
  const btn=document.getElementById("btn");
  msg.innerHTML="";
  if(value===""){
    msg.className="error";
    msg.innerHTML="Please enter your L1 code, Employee ID or Mobile Number.";
    return;
  }
  loader.classList.add("show");
  btn.disabled=true;
  try{
    const response=await fetch(API_URL+"?input="+encodeURIComponent(value));
    const data=await response.json();
    loader.classList.remove("show");
    btn.disabled=false;
    if(data.status==="success"){
      msg.className="success";
      msg.innerHTML="Agenda found! Downloading...";
      window.open(data.url,"_blank");
    }else{
      msg.className="error";
      msg.innerHTML=data.message;
    }
  }catch(err){
    loader.classList.remove("show");
    btn.disabled=false;
    msg.className="error";
    msg.innerHTML="Unable to connect to server.";
  }
}
</script>
</body>
</html>
